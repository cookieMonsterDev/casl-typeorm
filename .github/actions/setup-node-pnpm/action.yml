name: Setup Node.js and pnpm
description: Install pnpm from packageManager, Node 24 with the pnpm store cached, and dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
