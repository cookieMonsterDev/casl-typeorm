name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/require-npm-oidc

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Integration tests (sqlite, in-process)
        run: pnpm test:integration
        env:
          DB: sqlite

      - name: Exchange GitHub OIDC token for an npm publish token
        run: node scripts/exchange-npm-oidc-token.mjs @cookiemonsterdev/casl-typeorm

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-oidc.npmrc
        run: pnpm exec semantic-release
