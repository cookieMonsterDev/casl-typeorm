version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Monthly schedule approximates "only update packages at least 1 month old".
    # Dependabot does not support a native min-version-age filter.
    schedule:
      interval: "monthly"
      day: "1"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      typescript-tooling:
        patterns:
          - "typescript*"
          - "typescript-eslint"
          - "@types/*"
          - "ts-jest"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
      testing:
        patterns:
          - "jest*"
          - "@jest/*"
          - "@types/jest"
      formatting:
        patterns:
          - "prettier*"
          - "lint-staged"
      commitlint:
        patterns:
          - "@commitlint/*"
      semantic-release:
        patterns:
          - "semantic-release*"
          - "@semantic-release/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "1"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
