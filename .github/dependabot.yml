version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Monthly schedule approximates "only update packages at least 1 month old".
    # Dependabot does not support a native min-version-age filter.
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    groups:
      typescript-tooling:
        patterns:
          - 'typescript*'
          - 'typescript-eslint'
          - '@types/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vite'
      database-drivers:
        patterns:
          - 'better-sqlite3'
          - 'pg'
          - 'mysql2'
          - 'mssql'
          - 'mongodb'
      formatting:
        patterns:
          - 'prettier*'
          - 'lint-staged'
      commitlint:
        patterns:
          - '@commitlint/*'
      semantic-release:
        patterns:
          - 'semantic-release*'
          - '@semantic-release/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'
